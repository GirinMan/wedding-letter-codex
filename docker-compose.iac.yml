services:
  wedding-letter-codex:
    image: ${CF_HARBOR_HOST:?CF_HARBOR_HOST must be set}/girinman/wedding-letter-codex:${WEDDING_LETTER_CODEX_IMAGE_TAG:?WEDDING_LETTER_CODEX_IMAGE_TAG must be set}
    container_name: wedding-letter-codex
    restart: unless-stopped
    networks:
      - proxy-tier
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  proxy-tier:
    external: true
