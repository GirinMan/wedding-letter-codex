<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="소중한 분들을 결혼식에 초대합니다." />
    <meta name="theme-color" content="#ffffff" />
    <title>모바일 청첩장</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./design-systems/foundation.css" />
    <link rel="stylesheet" href="./styles/core.css" />
    <script type="module" src="./scripts/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 바로가기</a>

    <header class="hero" aria-labelledby="headline">
      <div class="container hero__content">
        <h1 id="headline"></h1>
        <p class="couple" aria-label="신랑 신부 이름">
          <span id="partner1-name"></span>
          <span class="couple__separator" aria-hidden="true">&amp;</span>
          <span id="partner2-name"></span>
        </p>
        <p id="event-date" class="hero__meta"></p>
        <p class="hero__meta">
          <span id="hero-venue-name"></span>
          <span aria-hidden="true"> · </span>
          <span id="venue-hall"></span>
        </p>
      </div>
    </header>

    <main id="main">
      <section class="section" aria-labelledby="greeting-title">
        <div class="container prose">
          <h2 id="greeting-title">초대합니다</h2>
          <p id="greeting-copy"></p>
          <p id="closing-copy" class="prose__closing"></p>
        </div>
      </section>

      <section id="countdown" class="section section--surface" aria-labelledby="countdown-title">
        <div class="container centered">
          <h2 id="countdown-title">함께할 날</h2>
          <strong id="dday-label" class="dday"></strong>
          <p id="dday-description"></p>
        </div>
      </section>

      <section class="section" aria-labelledby="venue-title">
        <div class="container">
          <h2 id="venue-title">오시는 길</h2>
          <div class="venue">
            <strong id="venue-name"></strong>
            <span id="venue-hall"></span>
            <address id="venue-address"></address>
            <a
              id="venue-link"
              class="button button--secondary"
              href="#"
              target="_blank"
              rel="noreferrer"
              hidden
            >
              지도에서 보기
            </a>
          </div>
        </div>
      </section>

      <section id="contacts" class="section section--surface" aria-labelledby="contacts-title" hidden>
        <div class="container">
          <h2 id="contacts-title">연락하기</h2>
          <ul id="contact-list" class="contact-list" role="list"></ul>
        </div>
      </section>

      <section id="gallery" class="section" aria-labelledby="gallery-title" hidden>
        <div class="container container--wide">
          <h2 id="gallery-title">우리의 순간</h2>
          <ul id="gallery-list" class="gallery" role="list"></ul>
        </div>
      </section>

      <section id="accounts" class="section section--surface" aria-labelledby="accounts-title" hidden>
        <div class="container">
          <h2 id="accounts-title">마음 전하실 곳</h2>
          <ul id="account-list" class="account-list" role="list"></ul>
        </div>
      </section>

      <section id="rsvp" class="section" aria-labelledby="rsvp-title" hidden>
        <div class="container centered">
          <h2 id="rsvp-title">참석 여부 알려주기</h2>
          <p id="rsvp-deadline"></p>
          <a
            id="rsvp-link"
            class="button button--primary"
            href="#"
            target="_blank"
            rel="noreferrer"
          >
            참석 여부 전달
          </a>
        </div>
      </section>

      <section class="section section--closing" aria-label="청첩장 공유">
        <div class="container centered">
          <p>저희의 시작을 함께해 주세요.</p>
          <button id="share-button" class="button button--primary" type="button">
            청첩장 공유
          </button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>
          <span id="footer-partner1"></span>
          <span aria-hidden="true">&amp;</span>
          <span id="footer-partner2"></span>
        </p>
      </div>
    </footer>

    <button id="music-button" class="music-button" type="button" hidden>음악 켜기</button>
    <audio id="background-music" preload="none"></audio>

    <dialog id="gallery-dialog" class="gallery-dialog" aria-label="사진 크게 보기">
      <div class="gallery-dialog__toolbar">
        <span id="gallery-dialog-position"></span>
        <button id="gallery-close" class="button button--secondary" type="button">닫기</button>
      </div>
      <img id="gallery-dialog-image" alt="" />
      <div class="gallery-dialog__controls">
        <button id="gallery-previous" class="button button--secondary" type="button">
          이전 사진
        </button>
        <button id="gallery-next" class="button button--secondary" type="button">
          다음 사진
        </button>
      </div>
    </dialog>

    <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
  </body>
</html>
