name: Validate, build, and deploy

on:
  pull_request:
    paths:
      - "apps/**"
      - "deploy/**"
      - "docker-compose.yml"
      - "docker-compose.iac.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "deploy/**"
      - "docker-compose.yml"
      - "docker-compose.iac.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test, typecheck, and build
        run: npm run check

      - name: Validate local compose
        run: |
          cp .env.example .env
          sed -i 's/<replace-with-local-password>/ci-postgres-password/' .env
          sed -i 's/<replace-with-local-access-key>/ciwedding/' .env
          sed -i 's/<replace-with-local-secret-key>/ci-minio-secret-password/' .env
          sed -i 's/<admin@example.com>/admin@example.com/' .env
          sed -i 's/<replace-with-at-least-12-characters>/ci-admin-password/' .env
          sed -i 's/<invitation-admin>/CI-admin/' .env
          docker compose config --quiet

      - name: Verify API image
        run: docker build -f deploy/docker/api.Dockerfile -t wedding-api:verify .

      - name: Verify public image
        run: |
          docker build \
            -f deploy/docker/web.Dockerfile \
            --build-arg WEB_APP=public-web \
            --build-arg WEB_WORKSPACE=@wedding/public-web \
            --build-arg VITE_INVITATION_SLUG=our-wedding \
            -t wedding-public:verify .

      - name: Verify admin image
        run: |
          docker build \
            -f deploy/docker/web.Dockerfile \
            --build-arg WEB_APP=admin-web \
            --build-arg WEB_WORKSPACE=@wedding/admin-web \
            --build-arg VITE_PUBLIC_PREVIEW_URL=https://wedding.example.com \
            -t wedding-admin:verify .

  build-push:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: api
            dockerfile: deploy/docker/api.Dockerfile
            image: wedding-letter-codex-api
            build_args: ""
          - component: public
            dockerfile: deploy/docker/web.Dockerfile
            image: wedding-letter-codex-public
            build_args: |
              WEB_APP=public-web
              WEB_WORKSPACE=@wedding/public-web
              VITE_INVITATION_SLUG=our-wedding
          - component: admin
            dockerfile: deploy/docker/web.Dockerfile
            image: wedding-letter-codex-admin
            build_args: |
              WEB_APP=admin-web
              WEB_WORKSPACE=@wedding/admin-web
              VITE_PUBLIC_PREVIEW_URL=https://wedding.${{ vars.CF_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.${{ vars.CF_DOMAIN }}
          username: ${{ secrets.HARBOR_ROBOT_USER }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: harbor.${{ vars.CF_DOMAIN }}/girinman/${{ matrix.image }}:${{ github.sha }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger IaC deployment
        env:
          GH_TOKEN: ${{ secrets.IAC_DISPATCH_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"event_type":"deploy-wedding-invitation","client_payload":{"tag":"${{ github.sha }}"}}' \
            https://api.github.com/repos/GirinMan/serengeti-iac/dispatches
