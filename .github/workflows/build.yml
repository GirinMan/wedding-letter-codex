# ============================================================
# App Build & Deploy Pipeline
# ============================================================
# 이 워크플로우는 앱 이미지를 빌드해 Harbor 에 push 하고,
# serengeti-iac 에 repository_dispatch 를 보내 자동 배포한다.
#
# 사용 전 아래 플레이스홀더를 교체:
#   __APP_NAME__      → Harbor 이미지 이름 (e.g. my-service)
#   __DEPLOY_EVENT__  → IaC dispatch 이벤트 타입 (e.g. deploy-my-service)
#   __APP_PATH__      → 소스 경로 (e.g. app/, src/, website/)
#
# 필요한 Secrets (repo Settings → Secrets):
#   HARBOR_ROBOT_USER   — Harbor robot account 사용자
#   HARBOR_ROBOT_TOKEN  — Harbor robot account 토큰
#   IAC_DISPATCH_TOKEN  — GitHub PAT (serengeti-iac repo 에 dispatch 권한)
#
# 필요한 Variables (repo Settings → Variables):
#   CF_DOMAIN           — Cloudflare 도메인 (e.g. giraffe.ai.kr)
# ============================================================

name: Build __APP_NAME__

on:
  push:
    branches: [main]
    paths: ['__APP_PATH__/**']
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    # ─── 대용량 베이스 이미지(100MB+ 레이어)가 있으면 아래로 교체 ───
    # runs-on: [self-hosted, linux, x64, homelab]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # ─── self-hosted runner 사용 시 아래 주석 해제 ───
        # with:
        #   driver-opts: network=host

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.${{ vars.CF_DOMAIN }}
          username: ${{ secrets.HARBOR_ROBOT_USER }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}
          # ─── self-hosted runner (loopback) 사용 시 아래로 교체 ───
          # registry: localhost:8088

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./__APP_PATH__
          push: true
          tags: |
            harbor.${{ vars.CF_DOMAIN }}/girinman/__APP_NAME__:${{ github.sha }}
          # ─── self-hosted runner (loopback) 사용 시 아래로 교체 ───
          # tags: |
          #   localhost:8088/girinman/__APP_NAME__:${{ github.sha }}
          # ─── 빌드 시 필요한 ARG 가 있으면 추가 ───
          # build-args: |
          #   VITE_API_KEY=${{ secrets.SOME_API_KEY }}

      - name: Trigger IaC deploy
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.IAC_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"event_type":"__DEPLOY_EVENT__","client_payload":{"tag":"${{ github.sha }}"}}' \
            https://api.github.com/repos/GirinMan/serengeti-iac/dispatches
