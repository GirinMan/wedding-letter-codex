name: Validate, build, and deploy

on:
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project metadata
        run: npm ci

      - name: Test and validate
        run: npm run check

      - name: Verify container build
        run: docker build -t wedding-letter-codex:verify app

  build-push:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.${{ vars.CF_DOMAIN }}
          username: ${{ secrets.HARBOR_ROBOT_USER }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: harbor.${{ vars.CF_DOMAIN }}/girinman/wedding-letter-codex:${{ github.sha }}

      - name: Trigger IaC deployment
        env:
          GH_TOKEN: ${{ secrets.IAC_DISPATCH_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"event_type":"deploy-wedding-invitation","client_payload":{"tag":"${{ github.sha }}"}}' \
            https://api.github.com/repos/GirinMan/serengeti-iac/dispatches
